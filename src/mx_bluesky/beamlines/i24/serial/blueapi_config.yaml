env:
  sources:
    - kind: deviceManager
      module: dodal.beamlines.i24
    # The serial plans the edms still invoke by name, then the web UI plans. Remove
    # the serial source once the edms are gone.
    - kind: planFunctions
      module: mx_bluesky.beamlines.i24.serial
    - kind: planFunctions
      module: mx_bluesky.beamlines.i24
  events:
    broadcast_status_events: false
api:
  url: http://localhost:25565
  cors:
    allow_credentials: True
    origins: 
      - "*"
stomp:
  enabled: true
  url: tcp://i24-control.diamond.ac.uk:61613
logging:
  level: "DEBUG"
  graylog:
    url: "tcp://graylog-log-target.diamond.ac.uk:12231"
    enabled: true
